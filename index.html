<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>2026 Senate, House &amp; Governor Election Forecast Map | Live Wallpaper</title>
<meta name="description" content="Live, self-updating map of 2026 US Senate, House, and Governor race ratings, sourced from aggregated forecaster consensus (Cook, Sabato, Inside Elections, Silver Bulletin, and more) and real Cook PVI district data. Updated daily plus on breaking campaign news." />
<meta name="robots" content="index, follow" />
<link rel="canonical" href="https://election.rook.works/" />

<meta property="og:type" content="website" />
<meta property="og:url" content="https://election.rook.works/" />
<meta property="og:site_name" content="Rookworks" />
<meta property="og:title" content="2026 Senate, House &amp; Governor Election Forecast Map" />
<meta property="og:description" content="Live, self-updating US election ratings map for the 2026 midterms — Senate, House, and Governor races, forecaster-consensus sourced and updated daily." />

<meta name="twitter:card" content="summary" />
<meta name="twitter:title" content="2026 Senate, House &amp; Governor Election Forecast Map" />
<meta name="twitter:description" content="Live, self-updating US election ratings map for the 2026 midterms, updated daily from aggregated forecaster consensus and real Cook PVI data." />

<meta name="theme-color" content="#0b1220" />
<link rel="stylesheet" href="style.css" />
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Dataset",
  "name": "2026 US Senate, House, and Governor Election Forecast Ratings",
  "description": "Daily-updated consensus election ratings for the 2026 US Senate, House of Representatives, and gubernatorial races, aggregated from published forecaster ratings (Cook Political Report, Sabato's Crystal Ball, Inside Elections, Silver Bulletin, Race to the WH, and others) and Cook Partisan Voting Index district data.",
  "url": "https://election.rook.works/",
  "temporalCoverage": "2026-01-01/2026-11-03",
  "license": "https://creativecommons.org/licenses/by-sa/4.0/",
  "creator": { "@type": "Organization", "name": "Rookworks" },
  "keywords": ["2026 midterm elections", "Senate election forecast", "House election forecast", "governor race ratings", "election map", "Cook Partisan Voting Index", "generic ballot polling"],
  "distribution": [
    { "@type": "DataDownload", "encodingFormat": "application/json", "contentUrl": "https://election.rook.works/data/live-senate.json" },
    { "@type": "DataDownload", "encodingFormat": "application/json", "contentUrl": "https://election.rook.works/data/live-house.json" },
    { "@type": "DataDownload", "encodingFormat": "application/json", "contentUrl": "https://election.rook.works/data/live-governor.json" }
  ]
}
</script>
</head>
<body>
<noscript>
  <div style="max-width:640px;margin:40px auto;padding:0 20px;font-family:system-ui,sans-serif;color:#1a1a1a;">
    <h1>2026 Senate, House &amp; Governor Election Forecast Map</h1>
    <p>This page shows a live-updating map of 2026 US Senate, House of Representatives, and gubernatorial race ratings, sourced from aggregated published forecaster ratings (Cook Political Report, Sabato's Crystal Ball, Inside Elections, Silver Bulletin, Race to the WH, and others) and Cook Partisan Voting Index district data, refreshed daily and on breaking campaign news. Enable JavaScript to view the interactive map.</p>
  </div>
</noscript>
  <div id="app">
    <svg id="map" viewBox="0 0 960 603" preserveAspectRatio="xMidYMid meet" aria-label="US election map">
      <g id="district-layer"></g>
      <g id="state-layer"></g>
    </svg>

    <div id="mode-switcher" role="tablist" aria-label="Race type">
      <button class="mode-btn" data-mode="president" role="tab">President</button>
      <button class="mode-btn" data-mode="senate" role="tab">Senate</button>
      <button class="mode-btn" data-mode="house" role="tab">House</button>
      <button class="mode-btn" data-mode="governor" role="tab">Governor</button>
    </div>

    <div id="summary-card">
      <div id="summary-control" class="summary-control">—</div>
      <div id="summary-seats" class="summary-seats">
        <div class="seat-row">
          <span class="party-label dem">D</span>
          <div class="seat-bar"><div id="seat-bar-dem" class="seat-bar-fill dem"></div><div id="seat-bar-gop" class="seat-bar-fill gop"></div></div>
          <span class="party-label gop">R</span>
        </div>
        <div class="seat-numbers">
          <span id="dem-count">0</span>
          <span id="gop-count">0</span>
        </div>
      </div>
      <div id="summary-confidence" class="summary-confidence">—</div>
      <div id="methodology-note" class="methodology-note hidden">Consensus of forecaster ratings — skews conservative vs. raw current polling, especially in traditionally one-party states. Click a race for its latest poll.</div>
      <div id="summary-source" class="summary-source">—</div>
      <div id="last-updated" class="last-updated">Last updated —</div>
    </div>

    <div id="race-card" class="hidden">
      <div class="race-card-header">
        <span id="race-state-name"></span>
        <button id="race-card-close" aria-label="Close">×</button>
      </div>
      <div id="race-status-pill" class="race-status-pill"></div>
      <div id="race-candidates-table" class="candidates-table hidden">
        <div class="candidate-col" data-col="0">
          <div class="candidate-name"></div>
          <img class="candidate-photo" alt="" />
          <div class="candidate-meta"><span class="candidate-party"></span><span class="incumbent-flag hidden">Incumbent</span></div>
          <div class="candidate-pct"></div>
        </div>
        <div class="candidate-col" data-col="1">
          <div class="candidate-name"></div>
          <img class="candidate-photo" alt="" />
          <div class="candidate-meta"><span class="candidate-party"></span><span class="incumbent-flag hidden">Incumbent</span></div>
          <div class="candidate-pct"></div>
        </div>
      </div>
      <div id="race-margin-row" class="race-detail-row"><span class="detail-label">Margin</span><span id="race-margin"></span></div>
      <div class="race-detail-row"><span class="detail-label">Polls</span><span id="race-polls"></span></div>
      <svg id="race-trend" viewBox="0 0 240 60" preserveAspectRatio="none"></svg>
    </div>

    <div id="trend-card" class="hidden">
      <div class="trend-header">
        <div class="trend-title">Momentum</div>
        <div id="trend-window-picker" class="trend-window-picker">
          <button class="trend-window-btn" data-window="7">7d</button>
          <button class="trend-window-btn" data-window="30">30d</button>
          <button class="trend-window-btn" data-window="90">90d</button>
          <button class="trend-window-btn" data-window="all">All</button>
        </div>
      </div>
      <svg id="trend-chart" viewBox="0 0 200 56" preserveAspectRatio="none"></svg>
      <div id="trend-delta" class="trend-delta"></div>
    </div>

    <div id="offline-badge" class="hidden">Showing cached data</div>
  </div>

  <script src="app.js"></script>
</body>
</html>
